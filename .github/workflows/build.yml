name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Injected at build time so the endpoint can change (Tailscale -> public
      # URL) without touching Dart or Kotlin.
      #   Settings > Secrets and variables > Actions > Variables : API_BASE
      #   Settings > Secrets and variables > Actions > Secrets   : API_KEY
      API_BASE: ${{ vars.API_BASE || 'http://100.89.180.23:8790' }}
      API_KEY: ${{ secrets.API_KEY || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - run: flutter --version
      - run: flutter pub get
      - run: flutter test

      # The native widget reads its endpoint and secret from string resources.
      # This MUST run before the build -- patching afterwards would have no
      # effect, because the values are already compiled into the APK.
      - name: Point widget at the same API base and key
        run: |
          echo "DIAG base_len=${#API_BASE} key_len=${#API_KEY}"
          f=android/app/src/main/res/values/strings.xml
          sed -i "s|<string name=\"vector_api_base\">.*</string>|<string name=\"vector_api_base\">$API_BASE</string>|" "$f"
          sed -i "s|<string name=\"vector_api_key\">.*</string>|<string name=\"vector_api_key\">$API_KEY</string>|" "$f"
          grep -n 'vector_api' "$f" | sed 's|\(vector_api_key\">\).\{4\}.*|\1****|'

      - name: Build release APK
        run: >
          flutter build apk --release
          --target-platform android-arm64
          --split-per-abi
          --dart-define=API_BASE=$API_BASE
          --dart-define=API_KEY=$API_KEY

      - uses: actions/upload-artifact@v4
        with:
          name: vector-tasks-apk-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
